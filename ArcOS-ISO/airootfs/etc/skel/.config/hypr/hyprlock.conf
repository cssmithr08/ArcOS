background {
    path = /home/cssmithr/wallpapers/arch/wallpaper_1.png
    blur_size = 5
    blur_passes = 3
}

input-field {
    monitor = eDP-1              # or your monitor name
    size = 300, 60               # width, height of the bubble
    rounding = 30                # makes it pill-shaped or circular
    outline_thickness = 2
    outline_color = rgba(255,255,255,0.4)
    inner_color = rgba(0,0,0,0.4)
    font_color = rgba(255,255,255,1.0)

    position = 0, -100           # center offset (0,0 is center)
    halign = center
    valign = center

    placeholder_text = Password
    fail_text = Wrong password

    # Optional: show dots as you type
    hide_input = false
}

